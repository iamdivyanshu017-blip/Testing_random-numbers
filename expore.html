<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IID Suite - Batch Execution Panel (Dependencies Auto-Loaded)</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151f32;
            --accent-color: #a855f7; 
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --border-color: #1e293b;
            --console-bg: #030712;
            --success-color: #34d399;
            --error-color: #f87171;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 1.75rem;
            margin-top: 0;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 1rem;
            color: var(--accent-color);
        }

        .status-banner {
            background-color: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.2);
            color: #d8b4fe;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input[type="file"] {
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.8rem;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .hint {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: -0.25rem;
        }

        button {
            background-color: var(--accent-color);
            color: #ffffff;
            font-weight: 600;
            border: none;
            padding: 0.9rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        button:hover {
            background-color: #9333ea;
        }

        button:disabled {
            background-color: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .output-container {
            margin-top: 2rem;
        }

        pre {
            background-color: var(--console-bg);
            color: var(--success-color);
            padding: 1.5rem;
            border-radius: 8px;
            overflow-x: auto;
            font-family: monospace;
            font-size: 0.85rem;
            border: 1px solid var(--border-color);
            min-height: 250px;
            max-height: 600px;
            white-space: pre-wrap;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>IID Suite - All-In-One Batch Runner</h1>
    <div id="statusMsg" class="status-banner">Bootstrapping Python & installing dependencies inside browser layout...</div>
    
    <form id="batchForm">
        <div class="form-group">
            <label for="csv_file">1. Upload Target Dataset (CSV):</label>
            <input type="file" id="csv_file" accept=".csv" required disabled>
        </div>

        <div class="form-group">
            <label for="script_files">2. Select Your IID Python Scripts (Multiple Selection):</label>
            <input type="file" id="script_files" accept=".py" multiple required disabled>
            <div class="hint">Tip: Use Ctrl+A / Cmd+A inside your folder window to select all <code>test_*.py</code> files simultaneously.</div>
        </div>

        <button type="submit" id="submitBtn" disabled>Run All Selected Tests Concurrently</button>
    </form>

    <div class="output-container">
        <label>Unified Batch Output Terminal:</label>
        <pre id="consoleOutput">Awaiting initialization instructions...</pre>
    </div>
</div>

<script>
    let pyodideInstance;

    // Spin up engine and inject heavy packages directly into browser memory
    async function startEngine() {
        try {
            const statusBanner = document.getElementById('statusMsg');
            
            // 1. Load the core interpreter 
            pyodideInstance = await loadPyodide();
            
            // 2. Pre-load math modules into the browser tab's sandbox space
            statusBanner.textContent = "Installing Numpy & Scipy libraries locally into browser environment...";
            await pyodideInstance.loadPackage(["numpy", "scipy"]);
            
            statusBanner.textContent = "✓ Environment online. Python core + Numpy + Scipy are fully ready.";
            statusBanner.style.color = "#34d399";
            statusBanner.style.backgroundColor = "rgba(52, 211, 153, 0.1)";
            statusBanner.style.borderColor = "rgba(52, 211, 153, 0.2)";

            document.getElementById('csv_file').disabled = false;
            document.getElementById('script_files').disabled = false;
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('consoleOutput').textContent = "Ready for execution.";
        } catch (err) {
            document.getElementById('statusMsg').textContent = "Initialization problem detected at setup layer.";
            document.getElementById('consoleOutput').textContent = err.toString();
        }
    }
    startEngine();

    document.getElementById('batchForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const csvInput = document.getElementById('csv_file').files[0];
        const scriptFiles = document.getElementById('script_files').files;
        const consoleOutput = document.getElementById('consoleOutput');
        const submitBtn = document.getElementById('submitBtn');

        if (!csvInput || scriptFiles.length === 0) return;

        submitBtn.disabled = true;
        consoleOutput.textContent = "Beginning batch processing lifecycle...\n";
        consoleOutput.style.color = "var(--text-main)";

        // Read CSV dataset once
        const csvContent = await readAsTextAsync(csvInput);

        // Map parameters inside virtual space
        pyodideInstance.globals.set("raw_csv_data", csvContent);
        await pyodideInstance.runPythonAsync(`
            import sys
            import io

            with open('target_dataset.csv', 'w') as out_file:
                out_file.write(raw_csv_data)
        `);

        // Iterate through every selected script object in sequence
        for (let i = 0; i < scriptFiles.length; i++) {
            const scriptFile = scriptFiles[i];
            consoleOutput.textContent += `\n[RUNNING]: ${scriptFile.name} ...\n`;
            
            try {
                const scriptSource = await readAsTextAsync(scriptFile);
                
                // Set command line simulation arguments
                await pyodideInstance.runPythonAsync(`
                    sys.argv = ['${scriptFile.name}', 'target_dataset.csv']
                    sys.stdout = io.StringIO()
                    sys.stderr = io.StringIO()
                `);

                // Run code block natively
                await pyodideInstance.runPythonAsync(scriptSource);

                // Collect stdout printing output strings
                const currentStdout = await pyodideInstance.runPythonAsync("sys.stdout.getvalue()");
                const currentStderr = await pyodideInstance.runPythonAsync("sys.stderr.getvalue()");

                if (currentStdout) {
                    consoleOutput.textContent += currentStdout;
                }
                if (currentStderr) {
                    consoleOutput.textContent += `[ERROR LOGGED]:\n${currentStderr}\n`;
                }
                
                consoleOutput.textContent += `--------------------------------------------------------\n`;

            } catch (err) {
                consoleOutput.textContent += `[CRITICAL ANOMALY]: Failure executing context for ${scriptFile.name}.\nDetails: ${err.message}\n`;
                consoleOutput.textContent += `--------------------------------------------------------\n`;
            }
            
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }

        consoleOutput.textContent += `\n[BATCH SEQUENCE COMPLETE] - Evaluation processes processed.`;
        submitBtn.disabled = false;
    });

    function readAsTextAsync(fileObj) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(reader.error);
            reader.readAsText(fileObj);
        });
    }
</script>

</body>
</html>
