<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIST Randomness Test Suite</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 950px; margin: auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; border-bottom: 3px solid #3498db; padding-bottom: 10px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #34495e; }
        .file-upload { border: 2px dashed #bdc3c7; padding: 20px; text-align: center; border-radius: 6px; cursor: pointer; transition: background 0.3s; display: block;}
        .file-upload:hover { background-color: #ecf0f1; border-color: #3498db; }
        input[type="file"] { display: none; }
        textarea { width: 100%; height: 100px; padding: 10px; border: 1px solid #bdc3c7; border-radius: 4px; font-family: monospace; font-size: 14px; box-sizing: border-box; background-color: #fafafa; }
        button { background-color: #27ae60; color: white; padding: 15px 24px; border: none; border-radius: 5px; cursor: pointer; font-size: 18px; width: 100%; transition: background 0.2s; font-weight: bold; }
        button:hover { background-color: #2ecc71; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .status-box { margin-top: 20px; padding: 15px; border-radius: 5px; text-align: center; font-weight: bold; display: none; }
        .loading { background-color: #eaf2f8; color: #2980b9; border: 1px solid #3498db; }
        .error { background-color: #fdeaea; color: #c0392b; border: 1px solid #e74c3c; word-break: break-all; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        table { width: 100%; border-collapse: collapse; margin-top: 25px; display: none; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #34495e; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .pass { background-color: #eafaf1; color: #27ae60; font-weight: bold; }
        .fail { background-color: #fdedec; color: #c0392b; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>NIST Statistical Test Suite</h1>
        
        <div class="input-group">
            <label>Option 1: Upload CSV / Text File</label>
            <label for="fileInput" class="file-upload" id="dropZone">
                <span id="fileNameDisplay">Click to Upload CSV or Drag & Drop Here</span>
                <input type="file" id="fileInput" accept=".csv, .txt">
            </label>
        </div>

        <div class="input-group">
            <label for="binaryPreview">Option 2: Data Preview / Manual Input</label>
            <textarea id="binaryPreview" placeholder="Data preview will appear here..."></textarea>
            <div id="bitCount" style="text-align: right; font-size: 14px; color: #2c3e50; margin-top: 5px; font-weight: bold;">Length: 0 bits</div>
        </div>

        <div class="input-group">
            <label for="alpha">Significance Level (Alpha)</label>
            <input type="number" id="alpha" value="0.01" step="0.001" min="0.001" max="0.1">
        </div>

        <button id="runBtn" onclick="runTests()">Run Full NIST Suite</button>
        
        <div id="statusBox" class="status-box"></div>

        <table id="resultsTable">
            <thead>
                <tr>
                    <th>Test Name</th>
                    <th>P-Value</th>
                    <th>Verdict</th>
                    <th>Note / Error</th>
                </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
        </table>
    </div>

    <script>
        let FULL_BINARY_DATA = "";
        const fileInput = document.getElementById('fileInput');
        const previewArea = document.getElementById('binaryPreview');
        const bitCountLabel = document.getElementById('bitCount');
        const fileNameDisplay = document.getElementById('fileNameDisplay');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            fileNameDisplay.textContent = "Selected: " + file.name;
            const reader = new FileReader();
            reader.onload = function(e) {
                FULL_BINARY_DATA = e.target.result.replace(/[^01]/g, ''); 
                updateUI(true);
            };
            reader.readAsText(file);
        });

        previewArea.addEventListener('input', function() {
            FULL_BINARY_DATA = previewArea.value.replace(/[^01]/g, '');
            updateUI(false);
        });

        function updateUI(fromFileUpload) {
            const len = FULL_BINARY_DATA.length;
            bitCountLabel.textContent = `Length: ${len.toLocaleString()} bits`;
            if (fromFileUpload) {
                previewArea.value = len > 1000 ? FULL_BINARY_DATA.substring(0, 1000) + "..." : FULL_BINARY_DATA;
            }
        }

        async function runTests() {
            const alphaVal = parseFloat(document.getElementById('alpha').value);
            const statusBox = document.getElementById('statusBox');
            const table = document.getElementById('resultsTable');
            const tbody = document.getElementById('resultsBody');
            const btn = document.getElementById('runBtn');

            if (FULL_BINARY_DATA.length < 100) { alert("Insufficient data."); return; }

            statusBox.style.display = 'block';
            statusBox.className = 'status-box loading';
            statusBox.textContent = 'Running tests...';
            table.style.display = 'none';
            tbody.innerHTML = '';
            btn.disabled = true;

            try {
                const response = await fetch('http://127.0.0.1:8000/test_randomness', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ binary_data: FULL_BINARY_DATA, alpha: alphaVal })
                });

                const results = await response.json();
                displayResults(results);
                statusBox.className = 'status-box success';
                statusBox.textContent = 'Tests Completed.';
            } catch (error) {
                statusBox.className = 'status-box error';
                statusBox.textContent = 'Error: ' + error.message;
            } finally {
                btn.disabled = false;
            }
        }

        function displayResults(data) {
            const tbody = document.getElementById('resultsBody');
            data.forEach(row => {
                const tr = document.createElement('tr');
                
                // Logic to handle boolean PASS/FAIL or the custom string "FAIL (J < 500)"
                let isPass = row.verdict === true || row.verdict === 'PASS';
                let verdictText = isPass ? 'PASS' : (typeof row.verdict === 'string' ? row.verdict : 'FAIL');
                let verdictClass = isPass ? 'pass' : 'fail';

                tr.innerHTML = `
                    <td>${row.test_name}</td>
                    <td>${row.p_value}</td>
                    <td class="${verdictClass}">${verdictText}</td>
                    <td>${row.error || ''}</td>
                `;
                tbody.appendChild(tr);
            });
            document.getElementById('resultsTable').style.display = 'table';
        }
    </script>
</body>
</html>
